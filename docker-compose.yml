name: smart_stack

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart_server:latest
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      MCP_SERVER_TRANSPORT: "sse"
      LOG_LEVEL: "INFO"
      ENABLE_REST_API: "true"
      CETUS: "/opt/cetus/bin/cetus"
      CETUS_PROFILES_FILE: "/app/config/profiles.json"
      # Used only when a task explicitly requests the Ollama profiler.
      OLLAMA_HOST: "http://ollama:11434"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - server_files:/app/files
      - server_db:/app/db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 45s

  # Enable these services with: docker compose --profile llm up -d --build
  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama_init:
    profiles: [llm]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - ./ollama-smart-compiler-Modelfile:/workspace/Modelfile:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        if ! ollama show llama3.1-smart-compiler:latest >/dev/null 2>&1; then
          ollama pull llama3.1
          ollama create llama3.1-smart-compiler -f /workspace/Modelfile
        fi
    restart: "no"

  client:
    profiles: [llm]
    build:
      context: .
      dockerfile: Client_dockerfile
    image: smart_client:latest
    environment:
      MCP_SERVER_URL: "http://server:8000/sse"
      LLM_HOST: "${LLM_HOST:-http://ollama:11434/v1}"
      LLM_MODEL: "${LLM_MODEL:-llama3.1-smart-compiler:latest}"
      # Optional passthrough for an external provider; Ollama needs no API key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: "INFO"
      ALLOWED_PATHS: "file:///app/Testing_Examples"
    stdin_open: true
    tty: true
    restart: "no"
    depends_on:
      server:
        condition: service_healthy
      ollama_init:
        condition: service_completed_successfully

volumes:
  ollama_data:
  server_files:
  server_db:
